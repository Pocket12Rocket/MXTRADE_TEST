# Fast Sport storefront on k3s: Deployment, Service and Ingress.
#
# Placeholders to confirm before use:
#   - image:      registry/repository and tag of the built image (see README "Docker"). The
#                 NEXT_PUBLIC_* values are baked in at build time, so build one image per env.
#   - namespace:  "fastsport" (create it, or change it to match the backend/admin manifests).
#   - host/TLS:   fastsport.co.za and www.fastsport.co.za. Assumes k3s's default Traefik ingress
#                 and a cert-manager ClusterIssuer named "letsencrypt"; adjust to match the server.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastsport-client
  namespace: fastsport
  labels:
    app.kubernetes.io/name: fastsport-client
    app.kubernetes.io/part-of: fastsport
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: fastsport-client
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fastsport-client
        app.kubernetes.io/part-of: fastsport
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: client
          image: REGISTRY/fastsport-client:TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: 0.0.0.0
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: fastsport-client
  namespace: fastsport
  labels:
    app.kubernetes.io/name: fastsport-client
spec:
  selector:
    app.kubernetes.io/name: fastsport-client
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fastsport-client
  namespace: fastsport
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - fastsport.co.za
        - www.fastsport.co.za
      secretName: fastsport-client-tls
  rules:
    - host: fastsport.co.za
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fastsport-client
                port:
                  name: http
    - host: www.fastsport.co.za
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fastsport-client
                port:
                  name: http
